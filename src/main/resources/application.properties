# Local KEY=value settings, loaded when running from the project root.
# Environment variables still override these values.
spring.config.import=optional:file:.env[.properties]
spring.application.name=borrowing_management_system

# ===== Database Connection (Supabase PostgreSQL — ใช้ Session Pooler) =====
spring.datasource.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.zyymichoggnuycvrfhgi
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.thymeleaf.cache=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

server.port=8080

logging.level.org.hibernate.SQL=debug

# Avatar validation accepts at most 2 MB; transport leaves room for form overhead.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# Set these only in the server environment; never expose the service key to the browser.
app.storage.url=${SUPABASE_URL:}
app.storage.service-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.storage.bucket=${SUPABASE_AVATAR_BUCKET:avatars}
app.storage.migrate-legacy=${MIGRATE_LEGACY_AVATARS:false}

spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Enable the migrations profile after resolving duplicate slots and checking the baseline.
spring.flyway.enabled=false
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${SMTP_FROM:}
app.jobs.enabled=${APP_JOBS_ENABLED:true}

# Optional local .env switch for automatic versioned migrations.
spring.profiles.active=${APP_PROFILE:}
