# Local KEY=value settings, loaded when running from the project root.
# Environment variables still override these values.
spring.config.import=optional:file:.env[.properties]
spring.application.name=borrowing_management_system

# ===== Database Connection (Supabase PostgreSQL — ใช้ Session Pooler) =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.thymeleaf.cache=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

server.port=${PORT:8080}
server.address=0.0.0.0

logging.level.org.hibernate.SQL=debug

# Avatar validation accepts at most 2 MB; transport leaves room for form overhead.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# Set these only in the server environment; never expose the service key to the browser.
app.storage.url=${SUPABASE_URL:}
app.storage.service-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.storage.bucket=${SUPABASE_AVATAR_BUCKET:avatars}

spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Enable the migrations profile after resolving duplicate slots and checking the baseline.
spring.flyway.enabled=false
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${SMTP_FROM:}
app.jobs.enabled=${APP_JOBS_ENABLED:true}

# Optional local .env switch for automatic versioned migrations.
spring.profiles.active=${APP_PROFILE:}

# Optional fee and pagination overrides; defaults are centralized in config properties.
app.fees.standard-daily-fine=${APP_FEES_STANDARD_DAILY_FINE:50.00}
app.fees.vip-daily-fine=${APP_FEES_VIP_DAILY_FINE:30.00}
app.fees.standard-grace-days=${APP_FEES_STANDARD_GRACE_DAYS:0}
app.fees.vip-grace-days=${APP_FEES_VIP_GRACE_DAYS:2}
app.fees.scratch-rate=${APP_FEES_SCRATCH_RATE:0.20}
app.fees.damage-rate=${APP_FEES_DAMAGE_RATE:0.50}
app.fees.loss-rate=${APP_FEES_LOSS_RATE:1.00}
app.pagination.catalog-size=${APP_PAGINATION_CATALOG_SIZE:12}
app.pagination.request-size=${APP_PAGINATION_REQUEST_SIZE:10}
app.pagination.management-size=${APP_PAGINATION_MANAGEMENT_SIZE:10}
app.pagination.user-size=${APP_PAGINATION_USER_SIZE:10}
app.pagination.profile-size=${APP_PAGINATION_PROFILE_SIZE:5}

# Optional Google OpenID Connect sign-in
app.oauth.google.enabled=${GOOGLE_LOGIN_ENABLED:false}
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
