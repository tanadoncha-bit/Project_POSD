<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${statusCode} - ${statusTitle} - LeadIT|">Request error | LeadIT</title>
    <link rel="stylesheet" href="/css/error.css">
</head>
<body>

<main class="error-page">
    <div class="error-card">

        <div class="error-icon">!</div>

        <div class="error-code" th:text="${statusCode}"></div>

        <h1 th:text="${statusTitle}"></h1>

        <p th:text="${errorMessage}">ไม่สามารถดำเนินการคำขอนี้ได้</p>

        <div class="error-actions">
            <a href="/" class="error-button">
                กลับหน้าหลัก
            </a>

        </div>

        <div class="error-help">
            กรุณาตรวจสอบข้อมูลและลองใหม่อีกครั้ง
        </div>

    </div>
</main>

</body>
</html>
