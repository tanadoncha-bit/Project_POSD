<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Complete registration | LeadIT</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/signup-completion.css}"></head>
<body class="signup-completion">
<header class="signup-header"><span class="signup-logo" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="16" height="13" rx="2"/><path d="M4 16l-2 4h20l-2-4"/></svg></span><span>LeadIT</span></header>
<main class="signup-stage">
<section class="auth-modal registration-modal signup-dialog" aria-labelledby="signup-title">
<h2 id="signup-title">Sign Up</h2>
<p class="signup-error" role="alert" th:if="${accountError}" th:text="${accountError}"></p>
<form id="google-signup-form" class="registration-form" method="post" th:action="@{/profile/setup-login}">
<label>Username<input name="username" th:value="${setupValues != null ? setupValues['username'] : ''}" required minlength="3" maxlength="50" pattern="[A-Za-z0-9_.-]{3,50}" autocomplete="username" placeholder="Enter your username"></label>
<div class="registration-grid">
<label>Password<input type="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="Enter your password"></label>
<label>Confirm Password<input type="password" name="confirmPassword" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="Enter your password again"></label>
</div>
<label>Full Name<input name="fullName" th:value="${setupValues != null ? setupValues['fullName'] : profileDisplayName}" required maxlength="150" autocomplete="name" placeholder="Enter your full name"></label>
<label>Email <span class="signup-verified">Verified with Google</span><input type="email" th:value="${user.email}" readonly autocomplete="email"></label>
<label>Phone<input name="phone" th:value="${setupValues != null ? setupValues['phone'] : (profile != null ? profile.phone : '')}" maxlength="20" autocomplete="tel" placeholder="Enter your phone"></label>
<label>Department<input name="department" th:value="${setupValues != null ? setupValues['department'] : (profile != null ? profile.department : '')}" maxlength="100" placeholder="Enter your department"></label>
<p class="signup-hint">Use 8-72 characters. Both passwords must match. Your Google email is already verified.</p>
</form>
<div class="signup-actions"><button class="registration-submit" type="submit" form="google-signup-form">Continue</button><form method="post" th:action="@{/logout}"><button class="registration-cancel" type="submit">Cancel</button></form></div>
</section></main></body></html>
