<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Set up login | LeadIT</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/equipment-workflows.css}"></head>
<body class="email-verification-page"><main class="email-verification-card"><p class="email-verification-brand">LeadIT</p><h1>Set username and password</h1><p>You can continue signing in with Google. Set these to also sign in with a username and password.</p><p role="alert" th:if="${accountError}" th:text="${accountError}"></p>
<form class="login-setup-form" method="post" th:action="@{/profile/setup-login}"><label>Username<input name="username" required minlength="3" maxlength="50" pattern="[A-Za-z0-9_.-]{3,50}" autocomplete="username"></label><label>Password<input type="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirmPassword" required minlength="8" maxlength="72" autocomplete="new-password"></label><p>After saving, sign in again with your new username or Google.</p><button class="button button-dark" type="submit">Save login details</button><a th:href="@{/profile}">Cancel</a></form></main></body></html>
