<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, 'profile', ~{::content})}">
<head><title>Change password | LeadIT</title></head>
<body>
<main class="password-settings-page" th:fragment="content">
    <a class="password-back-link" th:href="@{/profile}" href="/profile">
        <span aria-hidden="true">&larr;</span> Back to profile
    </a>
    <section class="password-settings-card" aria-labelledby="password-settings-title">
        <header class="password-settings-heading">
            <h1 id="password-settings-title">Change password</h1>
            <p>Choose a new password to keep your account secure.</p>
        </header>
        <p data-toast="error" role="alert" th:if="${accountError}" th:text="${accountError}"></p>
        <form class="password-settings-form" method="post" th:action="@{/profile/change-password}">
            <div class="password-settings-field">
                <label for="current-password">Current password</label>
                <input id="current-password" type="password" name="currentPassword" autocomplete="current-password" required>
            </div>
            <div class="password-settings-field">
                <label for="new-password">New password</label>
                <input id="new-password" type="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" aria-describedby="password-requirements" required>
                <p id="password-requirements">Use at least 8 characters.</p>
            </div>
            <div class="password-settings-field">
                <label for="confirm-password">Confirm new password</label>
                <input id="confirm-password" type="password" name="confirmPassword" autocomplete="new-password" minlength="8" maxlength="72" required>
            </div>
            <div class="password-settings-actions">
                <a class="password-settings-cancel" th:href="@{/profile}" href="/profile">Cancel</a>
                <button class="password-settings-save" type="submit">Save password</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
