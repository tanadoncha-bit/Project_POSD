name: Build and test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: review_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: leadit_test
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U review_test -d leadit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:55439/leadit_test
      TEST_POSTGRES_USERNAME: review_test
      TEST_POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/
